<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Mac-like defaults: Inter (San Francisco-style UI face) for sans-serif
       and the names Mac software asks for, JetBrains Mono for monospace and
       the monospace names Mac software asks for (Menlo, Monaco, Courier). Installed after 60-generic.conf, which
       prepends DejaVu Sans, so these prepends put Inter first.
       Window Maker's "Sans" and GNUstep's fontconfig-backed lookups both
       fall through 49-sansserif.conf to sans-serif. -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Helvetica</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Helvetica Neue</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Inter</string></edit>
  </match>
  <!-- CJK: Inter has no Han/kana/Hangul. Put Noto Sans CJK right behind it for sans-serif so
       GNUstep's and Xft's sorted-list fallback finds it before GNU Unifont. JP is the default
       Han; lang-tagged matches promote the regional face when the locale asks for one. -->
  <alias binding="same">
    <family>sans-serif</family>
    <accept>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Sans CJK HK</family>
    </accept>
  </alias>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="same"><string>JetBrains Mono</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Menlo</string></test>
    <edit name="family" mode="prepend" binding="same"><string>JetBrains Mono</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Monaco</string></test>
    <edit name="family" mode="prepend" binding="same"><string>JetBrains Mono</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Courier</string></test>
    <edit name="family" mode="prepend" binding="same"><string>JetBrains Mono</string></edit>
  </match>
  <!-- What follows JetBrains Mono when it lacks a glyph: DejaVu Sans Mono, then whatever
       fontconfig finds that covers the character (GNU Unifont for the whole BMP, Noto
       Emoji for emoji). Terminals and GNUstep both fall back through the sorted list. -->
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer><family>Noto Emoji</family></prefer>
  </alias>
</fontconfig>
