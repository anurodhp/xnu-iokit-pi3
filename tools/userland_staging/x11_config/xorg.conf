# /etc/X11/xorg.conf for Xorg on this port's HDMI framebuffer (DAR-389).
# Installed by build_xf86_video_puredarwingop.sh; on Xorg's default search
# path (xserver hw/xfree86/common/xf86Config.c:81).
#
# The only screen is PureDarwin's puredarwingop driver on IOBootFramebuffer
# (32 bpp, masks 0xff0000/0xff00/0xff, depth 24; DAR-358). The size is
# whatever the kernel got from the VideoCore: 640x480 unless the fb_width/
# fb_height boot-args say otherwise (the real Pi runs 1280x720).
# Input is xf86-input-iohid (DAR-391, build_xf86_input_iohid.sh): one
# keyboard and one pointer device, each reading every IOHIDEventService of
# its kind. Xorg must be signed with the HID entitlements (build_xserver.sh).
# AutoAddDevices and AutoEnableDevices keep their defaults (on): turning
# either off sets forceInputDevices (xf86Config.c:884-886), which adds
# implicit "mouse"/"kbd" devices whose drivers do not exist here. With no
# udev/HAL backend, auto-add finds nothing, and the devices below are the
# only real ones.

Section "Device"
    Identifier "HDMI"
    Driver     "puredarwingop"
    # DAR-460, see docs/framebuffer-mapping.md. Defaults shown.
    # VRAMCacheMode: "writecombine" (Normal non-cacheable), "posted"
    # (Device-nGnRE), "inhibit" (Device-nGnRnE) or "default" (the kernel's
    # choice, Device-nGnRnE here: the mapping before DAR-460).
    Option     "VRAMCacheMode"     "writecombine"
    # ShadowFB: draw into a RAM copy, copy damaged areas to VRAM. "off"
    # draws straight into VRAM.
    Option     "ShadowFB"          "on"
    # ShadowUpdateDelay: ms to hold copies so a burst of drawing is copied
    # once (wait for a quiet gap of half this, at most this long). 0 = copy
    # whenever the server goes idle.
    Option     "ShadowUpdateDelay" "0"
    # ShadowStats: log copy counts and time to Xorg.0.log every 10 s.
    #Option    "ShadowStats"       "on"
EndSection

Section "Screen"
    Identifier   "Screen0"
    Device       "HDMI"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "InputDevice"
    Identifier "Keyboard0"
    Driver     "iohid"
    Option     "Type" "keyboard"
EndSection

Section "InputDevice"
    Identifier "Pointer0"
    Driver     "iohid"
    Option     "Type" "pointer"
EndSection

Section "ServerLayout"
    Identifier  "Layout0"
    Screen      "Screen0"
    InputDevice "Keyboard0" "CoreKeyboard"
    InputDevice "Pointer0"  "CorePointer"
EndSection
