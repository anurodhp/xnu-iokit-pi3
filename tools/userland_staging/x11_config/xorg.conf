# /etc/X11/xorg.conf for Xorg on this port's HDMI framebuffer (DAR-389).
# Installed by build_xf86_video_puredarwingop.sh; on Xorg's default search
# path (xserver hw/xfree86/common/xf86Config.c:81).
#
# The only screen is PureDarwin's puredarwingop driver on IOBootFramebuffer
# (640x480, 32 bpp, masks 0xff0000/0xff00/0xff, depth 24; DAR-358).
# No input devices yet: no X input driver is ported (DAR-391). AutoAddDevices
# and AutoEnableDevices keep their defaults (on): turning either off sets
# forceInputDevices (xf86Config.c:884-886), which makes the server add
# implicit "mouse"/"kbd" devices (1107-1146, 1206-1242) whose drivers do not
# exist here; it logs errors for them and carries on. With both on and no
# udev/HAL backend, the server runs with only its virtual core pointer and
# keyboard.

Section "Device"
    Identifier "HDMI"
    Driver     "puredarwingop"
EndSection

Section "Screen"
    Identifier   "Screen0"
    Device       "HDMI"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "Layout0"
    Screen     "Screen0"
EndSection
