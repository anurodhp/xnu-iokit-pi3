# /etc/gsdm/gsdm.conf -- gsdm, this port's graphical login.
# Written by tools/userland_staging/build_gsdm.sh; every key is described
# in third_party/gsdm/README.md.

# One local display: Xorg on the HDMI framebuffer (puredarwingop driver).
# gsdm appends "-auth <auth_dir>/auth-0". Xorg needs the USB mouse plugged
# in before boot (DAR-442). As with xdm, the server is terminated after
# every session and started fresh for the next login window.
display = :0
server = /usr/X11/bin/Xorg :0 -nolisten tcp
auth_dir = /var/lib/gsdm

# Off switches, checked before anything starts (gsdm then exits 0 and
# launchd does not restart it): the file, and the kernel boot-arg the
# HDMI framebuffer needs (osfmk/arm/arm_init.c parses hdmi_console; QEMU
# without -hdmi and boots without it have no framebuffer for Xorg).
disable_file = /etc/x11-session.disabled
require_bootarg = hdmi_console

greeter = /etc/gsdm/Xgreeter
greeter_home = /var/lib/gsdm/greeter
session = /etc/gsdm/Xsession
user_path = /usr/X11/bin:/usr/local/bin:/bin:/usr/bin
system_path = /usr/X11/bin:/usr/local/sbin:/usr/local/bin:/sbin:/usr/sbin:/bin:/usr/bin

# Restart and Shut Down: system_cmds' reboot(8)/halt(8) (build_reboot.sh),
# which hand the request to launchd.
reboot = /sbin/reboot
halt = /sbin/halt

# The login window lists accounts with uid >= min_uid and a login shell;
# "Other..." takes any account name (root included: allow_root_login).
min_uid = 500
allow_root_login = yes
title = Darwin
# A picture for the background instead of the blue gradient (any format
# NSImage reads, scaled to fill the screen). Empty: the gradient.
background_image =
