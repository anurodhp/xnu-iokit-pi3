# /etc/login.conf -- minimal. pw(8) calls login_setcryptfmt(lc, "sha512", NULL)
# (third_party/freebsd-src/usr.sbin/pw/pw_user.c:228,1410,1757); with no
# login.conf login_getpwclass() fails and pw prints
# "pw: setting crypt(3) format: No such file or directory". This project's
# crypt(3) is Apple's DES-only implementation (see
# tools/userland_staging/pw_crypt_set_format_compat.c), so the class asks for
# "des" explicitly: pw then finds a format it can produce and stays quiet.
# NOTE: DES crypt uses only the first 8 characters of a password.
default:\
	:passwd_format=des:
