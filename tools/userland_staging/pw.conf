#
# pw.conf - user/group configuration defaults (real FreeBSD pw(8) format,
# keywords from third_party/freebsd-src/usr.sbin/pw/pw_conf.c's kwds[]).
# Installed at /etc/pw.conf by tools/init_binary/inject_into_sd_image.sh.
# Only the entries that differ from pw_conf.c's compiled-in defaults
# ("/home", "sh", shells sh/csh/tcsh) are set; this project follows the
# macOS convention of /Users/<name> homes and ships bash, not csh/tcsh.
#

# Root directory in which $HOME directory is created
home = "/Users"

# Colon separated list of directories containing valid shells
shellpath = "/bin"

# Comma separated list of available shells (without paths)
shells = "bash","sh"

# Default shell (without path)
defaultshell = "bash"
