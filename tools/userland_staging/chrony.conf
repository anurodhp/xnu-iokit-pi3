# DAR-169: real chrony config for this project, staged to /etc/chrony.conf
# by tools/init_binary/inject_into_sd_image.sh. Based on chrony's own
# real third_party/chrony/examples/chrony.conf.example1, minus the
# `rtcsync` directive -- this build's own real ./configure run disables
# FEAT_RTC (tools/userland_staging/build_chrony.sh's own header comment
# explains why: FEAT_RTC only ever compiles on Linux upstream anyway,
# and this board has no RTC driver), so `rtcsync` would be a real,
# always-ignored no-op here rather than a working directive.

# Use four public NTP servers from the pool.ntp.org project (same real
# default real chrony's own example1 config uses).
pool pool.ntp.org iburst

# Record the rate at which the system clock gains/losses time.
driftfile /var/lib/chrony/drift

# Allow the system clock to be stepped in the first three updates
# if its offset is larger than 1 second.
makestep 1.0 3
